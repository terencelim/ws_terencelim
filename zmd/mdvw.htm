    <script type="module" src="https://cdn.jsdelivr.net/npm/zero-md@3?register">
      import ZeroMD { STYLES } from 'https://cdn.jsdelivr.net/npm/zero-md@3'
    
      customElements.define('zero-md', class extends ZeroMd {
        async load() {
          await super.load()
          this.template = STYLES.preset('light') // or STYLES.preset('dark')
          this.template += `<style>:host { display: block; }</style><link rel="stylesheet" href="path/to/markdown-styles.css" /><link rel="stylesheet" href="path/to/highlight-styles.css" />`
        }
      })
    </script>    
    <meta charset="utf-8">
</head>

<body>
    <div style="width:95%; margin:0 auto;" id="mdcontainer">

</body>

<script>
    function getQuery(key) {
        var query = window.location.search.substring(1);
        var key_values = query.split("&");
        var params = {};
        key_values.map(function (key_val) {
            var key_val_arr = key_val.split("=");
            params[key_val_arr[0]] = key_val_arr[1];
        });
        if (typeof params[key] != "undefined") {
            return params[key];
        }
        return "";
    }

    window.onload = function () {
        md = document.createElement("zero-md")
        md.setAttribute("src", getQuery("src"))
        md.setAttribute("no-shadow", "")
        document.getElementById("mdcontainer").append(md)
    }
</script>
